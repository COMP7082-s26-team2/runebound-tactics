services:
  # 1. The Colyseus Backend
  - type: web
    name: colyseus-backend
    env: node
    plan: free
    # Notice: No rootDir here so Render can see /shared
    port: 2567
    buildCommand: yarn install && yarn workspace @runebound-tactics/server build
    startCommand: yarn workspace @runebound-tactics/server start
    envVars:
      - key: NODE_VERSION
        value: 22.18.0 # <-- Forces Render to use a stable LTS Node version

- type: web
    name: nextjs-frontend
    env: node
    plan: free
    buildCommand: yarn install && yarn workspace @runebound-tactics/client build
    # Using 'serve' via yarn instead of npx to ensure package reliability
    startCommand: yarn serve -s client/out -l $PORT
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.18.0 # <-- Forces Render to use a stable LTS Node version    