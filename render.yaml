services:
  # 1. The Colyseus Backend
  - type: web
    name: colyseus-backend
    env: node
    plan: free
    # Notice: No rootDir here so Render can see /shared
    buildCommand: yarn install && yarn workspace @runebound-tactics/server build
    startCommand: yarn workspace @runebound-tactics/server start
  # 2. The Next Frontend Client
  - type: web
    name: rune-frontend
    env: node
    plan: free
    buildCommand: yarn install && yarn workspace @runebound-tactics/client build
    startCommand: yarn workspace @runebound-tactics/client start
